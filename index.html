<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCFP Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
{box-sizing:border-box;margin:0;padding:0}
body{background:#0F1117;color:#F0EDE8;font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#161B27;border:1px solid rgba(59,130,246,0.4);border-radius:12px;width:100%;max-width:400px;padding:40px;box-shadow:0 0 60px rgba(59,130,246,0.1)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:32px}
.flame{display:none}
.logo span{color:#3B82F6}
label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5C5A57;margin-bottom:5px}
input{width:100%;background:#1E293B;border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:11px 13px;color:#F0EDE8;font-family:'Barlow',sans-serif;font-size:14px;outline:none;margin-bottom:16px;transition:border-color 0.15s}
input:focus{border-color:#3B82F6}
button{width:100%;background:#3B82F6;color:white;border:none;border-radius:6px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.15s;margin-top:4px}
button:hover{background:#2563EB}
button:disabled{opacity:0.5;cursor:not-allowed}
.status{text-align:center;font-size:12px;color:#5C5A57;margin-top:12px;min-height:18px}
.error{color:#60A5FA;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:6px;padding:10px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="#3B82F6" width="28" height="28"><path d="M12 2c0 0-6 5.686-6 10a6 6 0 0 0 12 0c0-2-1-3.5-2-4.5 0 2-1.5 3-1.5 3C14.5 8 12 2 12 2z"/></svg>
    BCFP<span>Connect</span>
  </div>
  <div class="error" id="err"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@bigcityfp.com" autocomplete="email">
  <label>Password</label>
  <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
  <button id="btn">Sign In</button>
  <div class="status" id="status">Ready</div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────
const URL  = 'https://xunjfqdppaoewppuuvph.supabase.co';
const KEY  = 'sb_publishable_KVlI2NcTccmuG91XVBsoKg_5si9m5Xv';
// ────────────────────────────────────────────────────

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setError(msg)  { var e = document.getElementById('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

document.getElementById('btn').addEventListener('click', function() {
  var email = document.getElementById('email').value.trim();
  var pass  = document.getElementById('pass').value;
  var btn   = document.getElementById('btn');

  setError('');
  if (!email || !pass) { setError('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  setStatus('Contacting Supabase...');

  fetch(URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': KEY,
      'Authorization': 'Bearer ' + KEY
    },
    body: JSON.stringify({ email: email, password: pass })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error || data.error_description) {
      setError(data.error_description || data.error || 'Login failed');
      setStatus('Failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    if (data.access_token) {
      setStatus('Success! Loading app...');
      localStorage.setItem('fd_token', data.access_token);
      localStorage.setItem('fd_user', JSON.stringify(data.user));
      // Get profile from Supabase
      fetch(URL + '/rest/v1/profiles?id=eq.' + data.user.id + '&select=', {
        headers: {
          'apikey': KEY,
          'Authorization': 'Bearer ' + data.access_token,
          'Content-Type': 'application/json'
        }
      })
      .then(function(r) { return r.json(); })
      .then(function(profiles) {
        var profile = profiles && profiles[0] ? profiles[0] : { role: 'dispatcher', full_name: data.user.email.split('@')[0] };
        // If no profile exists, create one
        if (!profiles || !profiles[0]) {
          fetch(URL + '/rest/v1/profiles', {
            method: 'POST',
            headers: {
              'apikey': KEY,
              'Authorization': 'Bearer ' + data.access_token,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({ id: data.user.id, full_name: data.user.email.split('@')[0], role: 'dispatcher' })
          });
        }
        localStorage.setItem('fd_profile', JSON.stringify(profile));
        setStatus('Welcome ' + (profile.full_name || 'back') + '! Loading...');
        setTimeout(function() { loadMainApp(data.access_token, profile); }, 300);
      })
      .catch(function() {
        localStorage.setItem('fd_profile', JSON.stringify({ role: 'dispatcher', full_name: 'Dispatcher' }));
        setTimeout(function() { loadMainApp(data.access_token, { role: 'dispatcher' }); }, 300);
      });
    } else {
      setError('Unexpected response — check console');
      setStatus('Error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      console.log('Response:', data);
    }
  })
  .catch(function(e) {
    setError('Network error: ' + e.message);
    setStatus('Network error');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
});

document.getElementById('pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btn').click();
});

setStatus('Ready — enter your credentials');

function loadMainApp(token, profile) {
  // Hide login card
  document.querySelector('.card').style.display = 'none';
  document.body.style.alignItems = 'stretch';
  document.body.style.display = 'block';
  document.body.style.background = '#0F1117';

  // Show loading
  var loading = document.createElement('div');
  loading.style.cssText = 'text-align:center;padding:40px;font-family:Barlow Condensed,sans-serif;font-size:20px;color:#3B82F6';
  loading.textContent = 'Loading BCFP Connect...';
  document.body.appendChild(loading);

  // Store auth for use in main app
  window.FD_TOKEN = token;
  window.FD_PROFILE = profile;
  window.FD_SUPABASE_URL = URL;
  window.FD_SUPABASE_KEY = KEY;

  // Redirect to the main app page with token
  window.location.href = 'index-app.html?role=' + (profile.role || 'dispatcher');
}

// Check if already logged in
var existingToken = localStorage.getItem('fd_token');
var existingProfile = localStorage.getItem('fd_profile');
if (existingToken && existingProfile) {
  try {
    var profile = JSON.parse(existingProfile);
    // Verify token is still valid
    fetch(URL + '/auth/v1/user', {
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + existingToken }
    }).then(function(r) {
      if (r.ok) {
        setStatus('Resuming session...');
        setTimeout(function() { loadMainApp(existingToken, profile); }, 300);
      } else {
        localStorage.removeItem('fd_token');
        localStorage.removeItem('fd_profile');
        setStatus('Session expired — please sign in');
      }
    }).catch(function() {
      setStatus('Ready — enter your credentials');
    });
  } catch(e) {
    setStatus('Ready — enter your credentials');
  }
}
</script>
</body>
</html>
