<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireDispatch Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D0D;color:#F0EDE8;font-family:'Barlow',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#161616;border:1px solid rgba(224,32,32,0.4);border-radius:12px;width:100%;max-width:400px;padding:40px;box-shadow:0 0 60px rgba(224,32,32,0.1)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:32px}
.flame{width:26px;height:26px;background:#E02020;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.logo span{color:#E02020}
label{display:block;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5C5A57;margin-bottom:5px}
input{width:100%;background:#1E1E1E;border:1px solid rgba(255,255,255,0.07);border-radius:6px;padding:11px 13px;color:#F0EDE8;font-family:'Barlow',sans-serif;font-size:14px;outline:none;margin-bottom:16px;transition:border-color 0.15s}
input:focus{border-color:#E02020}
button{width:100%;background:#E02020;color:white;border:none;border-radius:6px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;transition:background 0.15s;margin-top:4px}
button:hover{background:#C41A1A}
button:disabled{opacity:0.5;cursor:not-allowed}
.status{text-align:center;font-size:12px;color:#5C5A57;margin-top:12px;min-height:18px}
.error{color:#FF6B6B;background:rgba(224,32,32,0.1);border:1px solid rgba(224,32,32,0.3);border-radius:6px;padding:10px;font-size:12px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="flame"></div>
    Fire<span>Dispatch</span>
  </div>
  <div class="error" id="err"></div>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@bigcityfp.com" autocomplete="email">
  <label>Password</label>
  <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
  <button id="btn">Sign In</button>
  <div class="status" id="status">Ready</div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────
const URL  = 'https://xunjfqdppaoewppuuvph.supabase.co';
const KEY  = 'sb_publishable_KVlI2NcTccmuG91XVBsoKg_5si9m5Xv';
// ────────────────────────────────────────────────────

function setStatus(msg) { document.getElementById('status').textContent = msg; }
function setError(msg)  { var e = document.getElementById('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

document.getElementById('btn').addEventListener('click', function() {
  var email = document.getElementById('email').value.trim();
  var pass  = document.getElementById('pass').value;
  var btn   = document.getElementById('btn');

  setError('');
  if (!email || !pass) { setError('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in...';
  setStatus('Contacting Supabase...');

  fetch(URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': KEY,
      'Authorization': 'Bearer ' + KEY
    },
    body: JSON.stringify({ email: email, password: pass })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.error || data.error_description) {
      setError(data.error_description || data.error || 'Login failed');
      setStatus('Failed');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    if (data.access_token) {
      setStatus('Success! Loading app...');
      localStorage.setItem('fd_token', data.access_token);
      localStorage.setItem('fd_user', JSON.stringify(data.user));
      setTimeout(function() {
        window.location.href = 'app.html';
      }, 500);
    } else {
      setError('Unexpected response — check console');
      setStatus('Error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      console.log('Response:', data);
    }
  })
  .catch(function(e) {
    setError('Network error: ' + e.message);
    setStatus('Network error');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
});

document.getElementById('pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btn').click();
});

setStatus('Ready — enter your credentials');
</script>
</body>
</html>
